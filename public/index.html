<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Roam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a1a; color: #fff; overflow: hidden; height: 100vh; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s ease; z-index: 10; }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* Splash */
        #splash { background: #000; }
        #splash h1 { font-size: 48px; letter-spacing: 5px; opacity: 0; animation: fadeInOut 3s forwards; }
        #splash p { font-size: 14px; color: #888; opacity: 0; animation: fadeInOut 3s forwards 0.5s; }
        @keyframes fadeInOut { 0% { opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }

        /* Main */
        #main-menu { background: url('https://files.catbox.moe/9bhvwx.jpeg') no-repeat center center/cover; opacity: 1; }
        .menu-container { background: rgba(0,0,0,0.7); padding: 40px; border-radius: 20px; backdrop-filter: blur(5px); text-align: center; width: 90%; max-width: 400px; }
        .menu-container button { width: 100%; padding: 15px; margin: 10px 0; background: transparent; border: 2px solid #fff; color: #fff; font-size: 16px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .menu-container button:hover { background: #fff; color: #000; }

        /* Profile Button */
        .top-bar { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 20; }
        .top-bar img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; }
        .top-bar span { font-weight: bold; }

        /* Modal System */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 30; }
        .modal.active { display: flex; }
        .modal-content { background: #2a2a2a; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; max-height: 80vh; overflow-y: auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        .modal-content button { width: 100%; padding: 10px; margin-top: 10px; background: #c42121; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        
        /* Room List Style */
        .room-item { background: #444; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .room-pass { border-left: 4px solid #c42121; }
        .room-open { border-left: 4px solid #4ade80; }
        .secret-link { background: #333; padding: 10px; margin-top: 10px; border-radius: 5px; word-break: break-all; font-size: 12px; border: 1px dashed #4ade80; color: #4ade80; }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div class="screen" id="splash">
        <h1>CHESS GAME</h1>
        <p>powered by vines</p>
    </div>

    <!-- 2. MAIN MENU -->
    <div class="screen hidden" id="main-menu">
        <div class="top-bar" id="btnProfile">
            <img src="https://files.catbox.moe/pngw2k.jpeg" id="navProfilePic" alt="Profile">
            <span id="navUsername">Unknown</span>
        </div>

        <div class="menu-container">
            <h2 style="margin-bottom: 20px;">Chess Roam</h2>
            <button onclick="openModal('createRoomModal')">Buat ruang catur</button>
            <button onclick="openModal('settingsModal')">Pengaturan</button>
            <button onclick="openModal('joinRoomModal'); loadRooms();">Gabung Ke Ruangan</button>
        </div>
    </div>

    <!-- MODAL: CREATE ROOM -->
    <div class="modal" id="createRoomModal">
        <div class="modal-content">
            <h3>Buat Ruangan</h3>
            <label style="display:flex; justify-content:space-between; margin:10px 0;">
                Timer <input type="checkbox" id="roomTimer">
            </label>
            <label style="display:flex; justify-content:space-between; margin:10px 0;">
                Password <input type="checkbox" id="roomPasswordToggle">
            </label>
            <input type="text" id="roomPassword" placeholder="Masukkan Password" style="display:none;">
            <button onclick="createRoom()">Buat</button>
            <button style="background:#555;" onclick="closeModal('createRoomModal')">Batal</button>
            <div id="secretLinkResult" style="display:none;"></div>
        </div>
    </div>

    <!-- MODAL: JOIN ROOM -->
    <div class="modal" id="joinRoomModal">
        <div class="modal-content">
            <h3>Daftar Ruangan</h3>
            <div id="roomList" style="text-align:left; margin-top:10px; font-size:14px;">
                <!-- Diisi via JS -->
            </div>
            <button style="background:#555;" onclick="closeModal('joinRoomModal')">Tutup</button>
        </div>
    </div>

    <!-- MODAL: PROFILE (Sama kayak sebelumnya) -->
    <div class="modal" id="profileModal">
        <div class="modal-content" style="text-align:center;">
            <img src="https://files.catbox.moe/pngw2k.jpeg" id="modalProfilePic" style="width: 80px; height: 80px; border-radius:50%; margin-bottom:10px;">
            <h3 id="modalUsername">Unknown</h3>
            <p style="color:#aaa; font-size:12px;" id="modalBio">Belum login</p>
            
            <button onclick="openModal('loginModal')" id="btnLoginProfile">Login / Register</button>
            <button onclick="openModal('reportModal')" style="background:#555;">Laporkan Pengguna</button>
            <button style="background:#555;" onclick="closeModal('profileModal')">Tutup</button>
        </div>
    </div>

    <!-- MODAL: LOGIN (Sama kayak sebelumnya) -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3>Login / Register</h3>
            <input type="text" id="authUser" placeholder="Username">
            <input type="password" id="authPass" placeholder="Password">
            <button onclick="handleAuth('login')">Login</button>
            <button onclick="handleAuth('register')" style="background:#555;">Register</button>
        </div>
    </div>

    <!-- MODAL: REPORT (Sama kayak sebelumnya) -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <h3>Laporkan Pengguna</h3>
            <select id="reportType">
                <option value="Profil Tidak Pantas">Profil Tidak Pantas</option>
                <option value="Nama Tidak Pantas">Nama Tidak Pantas</option>
                <option value="Bio Tidak Pantas">Bio Tidak Pantas</option>
                <option value="Lainnya">Lainnya</option>
            </select>
            <textarea id="reportReason" placeholder="Alasan (opsional)"></textarea>
            <button onclick="sendReport()">Kirim Laporan</button>
            <button style="background:#555;" onclick="closeModal('reportModal')">Batal</button>
        </div>
    </div>

    <script>
        // --- UI Logic ---
        setTimeout(() => {
            document.getElementById('splash').classList.add('hidden');
            setTimeout(() => { document.getElementById('main-menu').classList.remove('hidden'); }, 1000);
        }, 3500);

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        document.getElementById('btnProfile').onclick = () => openModal('profileModal');

        // --- Auth Logic ---
        let currentUser = null; // Nyimpen data user yg login
        async function handleAuth(type) {
            const username = document.getElementById('authUser').value;
            const password = document.getElementById('authPass').value;
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            
            if (type === 'login') {
                currentUser = data.user;
                document.getElementById('navUsername').innerText = currentUser.username;
                document.getElementById('modalUsername').innerText = currentUser.username;
                document.getElementById('btnLoginProfile').style.display = 'none';
                closeModal('loginModal'); closeModal('profileModal');
                alert('Login Berhasil!');
            } else {
                alert('Register Berhasil, silakan login!');
            }
        }

        // --- Room Logic ---
        document.getElementById('roomPasswordToggle').onchange = (e) => {
            document.getElementById('roomPassword').style.display = e.target.checked ? 'block' : 'none';
        };

        async function createRoom() {
            if (!currentUser) return alert('Harus login dulu buat bikin ruangan!');
            
            const isPass = document.getElementById('roomPasswordToggle').checked;
            const password = isPass ? document.getElementById('roomPassword').value : null;
            const timer = document.getElementById('roomTimer').checked;

            const res = await fetch('/api/rooms/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hostId: currentUser.id, timer, password })
            });
            const data = await res.json();

            if (data.success) {
                // Tampilkan Link Rahasia HANYA untuk host
                const linkDiv = document.getElementById('secretLinkResult');
                linkDiv.style.display = 'block';
                linkDiv.innerHTML = `<p>Ruangan berhasil dibuat!</p>
                    <div class="secret-link">Link Rahasia (Khusus Host):<br><b>${window.location.origin}${data.secretLink}</b></div>
                    <button onclick="window.location.href='${data.secretLink}'">Masuk Sekarang</button>`;
            }
        }

        async function loadRooms() {
            const res = await fetch('/api/rooms');
            const rooms = await res.json();
            const listDiv = document.getElementById('roomList');
            listDiv.innerHTML = '';

            if (rooms.length === 0) {
                listDiv.innerHTML = '<p style="color:#aaa;">Belum ada ruangan.</p>';
                return;
            }

            // Render list (otomatis urut karena backend udah nyortir)
            rooms.forEach(room => {
                const isPass = room.password ? true : false;
                const roomEl = document.createElement('div');
                roomEl.className = `room-item ${isPass ? 'room-pass' : 'room-open'}`;
                roomEl.innerHTML = `
                    <div>
                        <b>Room ${room.id}</b><br>
                        <small>${isPass ? '🔒 Password' : '🔓 Terbuka'}</small>
                    </div>
                    <button onclick="joinRoom('${room.id}', ${isPass})">Join</button>
                `;
                listDiv.appendChild(roomEl);
            });
        }

        function joinRoom(id, isPass) {
            if (isPass) {
                const pass = prompt('Masukkan password ruangan:');
                // Logika verifikasi password ruangan (bisa ditambahin di backend nanti)
                if (pass) alert(`Masuk ke room ${id} dengan password ${pass}`);
            } else {
                window.location.href = `/room/${id}`;
            }
        }

        // --- Report Logic ---
        async function sendReport() {
            const type = document.getElementById('reportType').value;
            const reason = document.getElementById('reportReason').value;
            await fetch('/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, reason, targetUser: currentUser ? currentUser.username : 'Unknown' })
            });
            alert('Laporan berhasil dikirim ke Admin Telegram!');
            closeModal('reportModal');
        }
    </script>
</body>
</html>
